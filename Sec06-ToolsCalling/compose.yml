services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: on-failure
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vector_db
    volumes:
      - D:/JAVA/Spring-AI/Spring-AI-Udemy/docker-data/postgres:/var/lib/postgresql/data