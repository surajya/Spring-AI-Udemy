############################
# Spring AI Google GenAI properties
############################
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
logging.level.org.springframework.ai.chat.client.advisor=debug
############################
#postgres setup
############################
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordb
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
############################
#spring ai jdbc properties
# ###########################
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:/schema/schema-postgres.sql
############################
# PGVector
############################
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.dimensions=1536
############################
#Embedding model
############################
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536
############################
#redis setup
############################
spring.data.redis.host=localhost
spring.data.redis.port=6379
logging.level.org.springframework.ai=DEBUG
############################
#redis Dimension fix dimension 1536 for embedding vector
############################
#127.0.0.1:6379> FT.CREATE eazybytes-semantic-cache ON JSON PREFIX 1 "cache:" SCHEMA "$.content" AS content TEXT WEIGHT 1 "$.embedding" AS embedding VECTOR HNSW 10 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE M 16 EF_CONSTRUCTION 200 "$.response" AS response TEXT WEIGHT 1 "$.response_text" AS response_text TEXT WEIGHT 1 "$.ttl" AS ttl NUMERIC "$.context_hash" AS context_hash TAG SEPARATOR ","
#OK
