spring:
  application:
    name: mcpclient
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-server.json

logging:
  level:
    io:
      modelcontextprotocol: debug
    org:
        springframework:
            ai:
              chat:
                client:
                  advisor: debug
              mcp: debug

